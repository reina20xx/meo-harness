<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEO Harness — Zero-Cost Google Business Profile & AI Review Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <header class="border-b border-slate-800 bg-slate-900/70 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="px-2.5 py-1 rounded-md bg-blue-600/20 border border-blue-500/40 text-blue-300 text-xs font-bold">MEO HARNESS</span>
        <h1 class="text-lg font-bold">Googleマップ口コミAI自動返信 ＆ 地域キーワード順位トラッカー</h1>
      </div>
      <div class="text-xs text-emerald-400 font-mono">Cloudflare Workers + D1 + MCP (¥0/mo)</div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    <section class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-6">
      <h2 class="text-lg font-bold mb-4">Google口コミ着信シミュレータ（SEOキーワード自然挿入）</h2>
      <form id="revForm" class="space-y-3">
        <input id="reviewer_name" required value="佐々木 美咲" placeholder="投稿者名" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        <select id="star_rating" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm">
          <option value="5">★★★★★ (星5)</option>
          <option value="4">★★★★☆ (星4)</option>
          <option value="2">★★☆☆☆ (星2・改善要望)</option>
        </select>
        <input id="target_keywords" value="表参道 髪質改善 ヘッドスパ" placeholder="対策MEOキーワード" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        <textarea id="comment" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm">初めての利用でしたが、カウンセリングが丁寧で髪がツヤツヤになりました！個室の雰囲気も最高です。</textarea>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg text-sm">口コミ受信 ➔ MEOキーワード入りAI返信を即時生成</button>
      </form>
    </section>
    <section class="lg:col-span-7 space-y-6">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
        <h3 class="text-base font-bold mb-3">📍 Googleマップ検索順位トラッキング</h3>
        <div id="rankingsList" class="space-y-2 text-sm"></div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
        <h3 class="text-base font-bold mb-3">💬 口コミAI自動返信ログ</h3>
        <div id="reviewsList" class="space-y-3 text-sm"></div>
      </div>
    </section>
  </main>
  <script>
    async function load() {
      const data = await fetch('/api/dashboard').then(r => r.json());
      document.getElementById('rankingsList').innerHTML = data.rankings.map(r => `
        <div class="flex items-center justify-between p-3 rounded-lg bg-slate-950 border border-slate-800">
          <span class="font-bold">${r.keyword}</span>
          <span class="text-emerald-400 font-mono font-bold">現在 ${r.current_rank}位 (前回 ${r.previous_rank}位 ⬆)</span>
        </div>
      `).join('');
      document.getElementById('reviewsList').innerHTML = data.reviews.map(r => `
        <div class="p-4 rounded-xl bg-slate-950 border border-slate-800">
          <div class="flex justify-between mb-1"><span class="font-bold">${r.reviewer_name}</span><span class="text-amber-400">★${r.star_rating}</span></div>
          <div class="text-xs text-slate-400 mb-2">${r.comment}</div>
          <div class="text-xs bg-slate-900 p-3 rounded border border-blue-500/30 text-blue-200 whitespace-pre-wrap">${r.ai_reply_draft}</div>
        </div>
      `).join('') || '<div class="text-xs text-slate-500">口コミはまだありません</div>';
    }
    document.getElementById('revForm').addEventListener('submit', async e => {
      e.preventDefault();
      await fetch('/api/reviews/ingest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          reviewer_name: document.getElementById('reviewer_name').value,
          star_rating: Number(document.getElementById('star_rating').value),
          target_keywords: document.getElementById('target_keywords').value,
          comment: document.getElementById('comment').value,
        })
      });
      await load();
    });
    load();
  </script>
</body>
</html>
